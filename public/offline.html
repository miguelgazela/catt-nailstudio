<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7A3B52" />
    <meta name="robots" content="noindex" />
    <title>Sem ligação | Catarina Neves Nails Studio</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 20px;
        background: #f7f1ec;
        color: #2e1f26;
        font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 24px;
        text-align: center;
      }
      main { max-width: 360px; }
      img { width: 96px; height: 96px; border-radius: 20px; display: block; margin: 0 auto 24px; }
      h1 {
        margin: 0 0 12px;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 32px;
        line-height: 36px;
        font-weight: 600;
      }
      p { margin: 0 0 24px; color: #6b5a60; }
      button {
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: #7a3b52;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #5c2a3d; }
      button:focus-visible { outline: 3px solid #7a3b52; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="96" height="96" />
      <h1>Sem ligação</h1>
      <p>
        Não conseguimos chegar à internet. As marcações precisam de ligação para
        mostrar horários certos. Verifique a rede e tente outra vez.
      </p>
      <button type="button" onclick="location.reload()">Tentar outra vez</button>
    </main>
  </body>
</html>
